<script>document.documentElement.classList.add('js');</script>
<script>
/* 메뉴 이동 전환: 누른 고민 타일 사진이 다음 페이지 큰 이미지로 이어지게 이름을 붙임 (View Transitions 지원 브라우저만) */
(function(){
  var NAME='hero-media';
  function tileFor(url){ try{ var p=new URL(url).pathname.split('/').pop(); return p ? document.querySelector('.cn a[href="'+p+'"] .media') : null; }catch(e){ return null; } }
  function inView(el){ var r=el.getBoundingClientRect(); return r.bottom>0 && r.top<innerHeight; }
  document.addEventListener('click',function(e){
    var a=e.target.closest && e.target.closest('.cn a'); if(!a) return;
    var m=a.querySelector('.media'); if(m) m.style.viewTransitionName=NAME;
  });
  addEventListener('pageshow',function(){ document.querySelectorAll('.cn .media').forEach(function(m){ m.style.viewTransitionName=''; }); });
  addEventListener('pagereveal',function(e){
    if(!e.viewTransition || !window.navigation || !navigation.activation || !navigation.activation.from) return;
    var m=tileFor(navigation.activation.from.url);
    if(m && inView(m)){ m.style.viewTransitionName=NAME; e.viewTransition.finished.finally(function(){ m.style.viewTransitionName=''; }); }
  });
})();
</script>
<script type="application/ld+json">{{jsonld}}</script>
</head>
